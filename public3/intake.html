<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>แจ้งเคสถึงทีม Support · Sinostech (SINO S-Tech Co., Ltd.)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&display=swap">
<style>
:root { --ink:#18212F; --muted:#5B6675; --line:#D9DFE8; --field:#C5CDD9; --bg:#F3F5F9; --card:#FFFFFF; --accent:#1F5FBF; --accent-d:#174A94; --tint:#EEF3FB; --red:#A5162E; --ok:#1C6B45; --okbg:#E2F3EA; --warn:#7A5600; --warnbg:#FBF0D2; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Anuphan", system-ui, sans-serif; font-size: 15px; line-height: 1.55; }
a { color: var(--accent); }
.wrap { max-width: 880px; margin: 0 auto; padding: 28px 16px 56px; }
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 600; }
.brand svg { color: var(--accent); }
.hdr-note { font-size: 13px; color: var(--muted); }
main { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 32px 36px; display: flex; flex-direction: column; gap: 26px; }
@media (max-width: 640px) { main { padding: 22px 18px; } }
h1 { margin: 0; font-size: 28px; font-weight: 700; line-height: 1.3; }
h2 { margin: 0; font-size: 19px; font-weight: 700; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
.lead { margin: 6px 0 0; color: var(--muted); }
.req { color: var(--red); font-weight: 700; }
.cust { display: flex; align-items: center; gap: 12px; background: var(--tint); border-radius: 12px; padding: 14px 18px; }
.cust.warn { background: var(--warnbg); color: var(--warn); }
.test { background: var(--warnbg); color: var(--warn); border-radius: 10px; padding: 10px 14px; font-weight: 600; }
section { display: flex; flex-direction: column; gap: 18px; }
form { display: flex; flex-direction: column; gap: 28px; }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px 22px; }
@media (max-width: 640px) { .grid { grid-template-columns: 1fr; } }
.f { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.f > label, .f > .lbl { font-size: 15px; font-weight: 600; }
.f input, .f select, .f textarea { font: inherit; color: var(--ink); background: #FFF; border: 1px solid var(--field); border-radius: 10px; padding: 0 14px; min-height: 46px; width: 100%; }
.f input[type=radio], .f input[type=checkbox] { width: 18px; height: 18px; min-height: 0; padding: 0; margin: 0; flex: none; }
.f textarea { padding: 12px 14px; line-height: 1.6; resize: vertical; }
.f input:focus, .f select:focus, .f textarea:focus { outline: 3px solid color-mix(in srgb, var(--accent) 30%, transparent); border-color: var(--accent); }
.f input[readonly] { background: #F6F7F9; }
.hint { font-size: 13px; color: var(--muted); line-height: 1.5; }
.ex { font-size: 13px; color: var(--muted); }
.ex b { color: #3B4452; font-weight: 600; }
.sev { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 760px) { .sev { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.sev label { display: flex; flex-direction: column; gap: 6px; border: 1px solid var(--line); border-radius: 12px; padding: 12px; cursor: pointer; }
.sev label:has(input:checked) { border: 2px solid var(--accent); background: var(--tint); padding: 11px; }
.sev .t { display: flex; align-items: center; gap: 6px; font-weight: 700; }
.sev .d { font-size: 12px; line-height: 1.5; color: #3B4452; }
.drop { display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 84px; border: 2px dashed var(--field); border-radius: 12px; color: var(--accent); font-weight: 600; cursor: pointer; text-align: center; padding: 10px; }
.drop.over { background: var(--tint); border-color: var(--accent); }
.files { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.files li { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: #F6F7F9; border-radius: 8px; padding: 6px 10px; font-size: 14px; }
.files button { font: inherit; border: 0; background: none; color: var(--red); cursor: pointer; }
.consent { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; color: #3B4452; }
.consent input { margin-top: 4px; width: 18px; height: 18px; flex: none; }
.foot { display: flex; align-items: center; justify-content: space-between; gap: 16px; border-top: 1px solid var(--line); padding-top: 20px; flex-wrap: wrap; }
.btn { font: inherit; min-height: 50px; padding: 0 28px; border-radius: 12px; border: 1px solid var(--field); background: #FFF; color: var(--ink); font-weight: 700; cursor: pointer; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #FFF; font-size: 17px; }
.btn.primary:hover { background: var(--accent-d); }
.btn:disabled { opacity: .6; cursor: wait; }
.err { background: #FDF1F3; color: var(--red); border-radius: 10px; padding: 12px 14px; font-weight: 600; }
.dup { background: var(--warnbg); color: var(--warn); border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
.hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
.center { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 12px; }
.okmark { width: 64px; height: 64px; border-radius: 50%; background: var(--okbg); display: flex; align-items: center; justify-content: center; }
.reqno { display: flex; flex-direction: column; align-items: center; gap: 4px; background: var(--tint); border-radius: 12px; padding: 18px; }
.reqno strong { font-size: 32px; letter-spacing: 1px; color: var(--accent); font-family: ui-monospace, "JetBrains Mono", monospace; }
dl.sum { margin: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 24px; border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; }
dl.sum dt { color: var(--muted); font-size: 13px; }
dl.sum dd { margin: 2px 0 0; font-weight: 600; }
dl.sum .full { grid-column: 1 / -1; }
ol.next { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; }
ol.next li { display: flex; gap: 12px; align-items: flex-start; }
ol.next span.n { flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: #FFF; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
.small { font-size: 13px; color: var(--muted); text-align: center; margin: 18px 0 0; }
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="brand"><svg width="26" height="26" viewBox="0 0 28 28" aria-hidden="true"><rect x="1" y="1" width="26" height="26" rx="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M6 18h4l3-8 3 12 3-8h3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Sinostech Support</span></div>
  <div class="hdr-note" id="exp"></div>
</header>
<main id="app" aria-live="polite"><p class="lead">กำลังโหลด…</p></main>
<p class="small" id="foot">Sinostech Support · ลิงก์นี้ใช้ได้ครั้งเดียว กรุณาอย่าส่งต่อให้ผู้อื่น</p>
</div>
<script src="/intake-form.js?v=3"></script>
</body>
</html>
