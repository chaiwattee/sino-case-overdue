<!doctype html>
<html lang="th" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Sino Case SLA</title>
<script>
  try { var t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="style.css?v=3.0.4">
</head>
<body>
<header class="topbar">
  <div class="topbar-in">
    <a class="brand" href="#/" aria-label="Sino Case SLA หน้าแรก">
      <svg class="mark" width="22" height="22" viewBox="0 0 28 28" aria-hidden="true">
        <rect x="1" y="1" width="26" height="26" rx="7" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M6 18h4l3-8 3 12 3-8h3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>Sino Case <b>SLA</b></span>
    </a>
    <nav class="tabs" aria-label="เมนูหลัก" id="tabs"></nav>
    <div class="status">
      <div class="usermenu">
        <button id="me-btn" class="pill" type="button" aria-haspopup="true" aria-expanded="false"><span class="avatar-s" id="me-av">?</span><span id="me-name">…</span></button>
        <div id="me-menu" class="menu" hidden>
          <div class="menu-head" id="me-head"></div>
          <a href="#/password" id="menu-pw" hidden>เปลี่ยนรหัสผ่าน</a>
          <button type="button" id="menu-logout">ออกจากระบบ</button>
        </div>
      </div>
      <button id="theme" class="icon-btn" type="button" aria-label="สลับธีมสว่าง/มืด">
        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </div>
  <div id="dry-banner" class="dry" hidden>โหมดทดสอบ: ระบบยังไม่ส่ง email จริง (DRY_RUN_EMAIL=1 ใน .env)</div>
</header>
<main id="app"><div class="loading">กำลังโหลดข้อมูล…</div></main>
<footer class="foot" id="nav-sources"></footer>
<script src="app.js?v=3.0.4"></script>
</body>
</html>
